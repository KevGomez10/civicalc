name: civicalc
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdf: ^3.8.1
  printing: ^5.13.1
  http: ^1.5.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/Logo Civicalc.png

flutter_launcher_icons:
  android: true
  windows:
    generate: true
  image_path: "assets/Logo Civicalc.png"
